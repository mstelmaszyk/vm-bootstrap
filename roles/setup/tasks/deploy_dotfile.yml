# -----------------------------------------------------------------------------
# STOW SETUP
# -----------------------------------------------------------------------------

- name: Ensure Stow is already installed
  become: true
  ansible.builtin.package:
    name: stow
    state: present

- name: "Deploy {{ dotfile_name }} dotfile"
  become: false
  ansible.builtin.command:
    cmd: >-
      stow --dotfiles -v
      -d {{ playbook_dir }}/dotfiles
      -t {{ user_home }}
      -R {{ dotfile_name }}
  changed_when: true