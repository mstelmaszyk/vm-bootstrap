# -----------------------------------------------------------------------------
# ZSH SETUP
# -----------------------------------------------------------------------------

- name: Install zsh and dependencies
  become: true
  ansible.builtin.package:
    name:
     - zsh
     - git
     - curl
    state: present
  tags: [zsh]

# -----------------------------------------------------------------------------
# INSTALL OH-MY-ZSH
# -----------------------------------------------------------------------------

- name: Clone Oh My Zsh
  become: false
  ansible.builtin.git:
    repo: https://github.com/ohmyzsh/ohmyzsh.git
    dest: "{{ user_home }}/.oh-my-zsh"
    depth: 1
  tags: [zsh]

- name: Set Zsh as a default shell
  become: true
  user:
    name: "{{ user_name }}"
    shell: /usr/bin/zsh
  tags: [zsh]

# -----------------------------------------------------------------------------
# INSTALL THEME
# -----------------------------------------------------------------------------

- name: Install Zsh theme
  become: false
  git:
    repo: "{{ zsh_theme.repo }}"
    dest: "{{ user_home }}/.oh-my-zsh/custom/themes/{{ zsh_theme.name }}"
    depth: 1
  when: zsh_theme.repo is defined
  tags: [zsh]

- name: Deploy theme config
  become: false
  copy:
    src: "{{ zsh_theme.config_file }}"
    dest: "{{ user_home }}/.p10k.zsh"
    mode: '0644'
  when: zsh_theme.config_file is defined
  tags: [zsh]

# -----------------------------------------------------------------------------
# PLUGINS
# -----------------------------------------------------------------------------

- name: Ensure plugin directory exists
  become: false
  file:
    path: "{{ user_home }}/.oh-my-zsh/custom/plugins"
    state: directory
    mode: '0755'
  tags: [zsh]

- name: Install external Zsh plugins
  become: false
  git:
    repo: "{{ item.repo }}"
    dest: "{{ user_home }}/.oh-my-zsh/custom/plugins/{{ item.name }}"
    depth: 1
  loop: "{{ zsh_plugins }}"
  when: item.repo is defined
  tags: [zsh]

# -----------------------------------------------------------------------------
# DEPLOY .ZSHRC
# -----------------------------------------------------------------------------

- include_tasks: deploy_dotfile.yml
  vars:
    dotfile_name: "zsh"
  tags: [zsh]

# -----------------------------------------------------------------------------
