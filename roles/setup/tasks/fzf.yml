- name: Ensure required packages are installed
  package:
    name:
      - git
      - curl
    state: present

- name: Ensure fzf repository is not present
  become: false
  file:
    path: ~/.local/src/fzf
    state: absent

- name: Clone fzf repository
  become: false
  git:
    repo: https://github.com/junegunn/fzf.git
    dest: ~/.local/src/fzf
    version: master

- name: Install fzf
  become: false
  command: ./install
  args:
    chdir: ~/.local/src/fzf
  register: fzf_install
  no_log: false
  async: 0
  poll: 0

- name: Symlink fzf binary
  become: false
  file:
    src: ~/.local/src/fzf/bin/fzf
    path: ~/.local/bin/fzf
    state: link
    force: true
