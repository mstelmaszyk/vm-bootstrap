- name: Ensure required packages are installed
  become: true
  ansible.builtin.package:
    name:
      - git
      - curl
    state: present
  tags: [fzf]

- name: Clone fzf repository
  ansible.builtin.git:
    repo: https://github.com/junegunn/fzf.git
    dest: "{{ user_home }}/.local/src/fzf"
    version: master
    depth: 1
  tags: [fzf]

- name: Install fzf binary
  ansible.builtin.command:
    cmd: ./install --bin
    chdir: "{{ user_home }}/.local/src/fzf"
    creates: "{{ user_home }}/.local/src/fzf/bin/fzf"
  tags: [fzf]

- name: Ensure ~/.local/bin exists
  ansible.builtin.file:
    path: "{{ user_home }}/.local/bin"
    state: directory
    mode: "0755"
  tags: [fzf]

- name: Symlink fzf binary
  ansible.builtin.file:
    src: "{{ user_home }}/.local/src/fzf/bin/fzf"
    dest: "{{ user_home }}/.local/bin/fzf"
    state: link
    force: true
  tags: [fzf]