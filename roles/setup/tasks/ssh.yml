# -----------------------------------------------------------------------------
# SSH SETUP
# -----------------------------------------------------------------------------

- name: Ensure .ssh directory exists
  become: false
  file:
    path: "{{ user_home }}/.ssh"
    state: directory
    mode: '0700'
  tags: [ssh]

# -----------------------------------------------------------------------------
# GENERATE SSH KEY
# -----------------------------------------------------------------------------

- name: Check if SSH key exists
  stat:
    path: "{{ user_home }}/.ssh/id_ed25519"
  register: ssh_key
  tags: [ssh]

- name: Generate SSH key
  become: false
  openssh_keypair:
    path: "{{ user_home }}/.ssh/id_ed25519"
    type: ed25519
    comment: "{{ git_user_email | default('generated-by-ansible') }}"
  when: not ssh_key.stat.exists
  tags: [ssh]

# -----------------------------------------------------------------------------
# SHOW PUBLIC KEY
# -----------------------------------------------------------------------------

- name: Read public key
  become: false
  slurp:
    src: "{{ user_home }}/.ssh/id_ed25519.pub"
  register: pubkey
  tags: [ssh]

- name: Display public key
  debug:
    msg: "{{ pubkey.content | b64decode }}"
  tags: [ssh]

# -----------------------------------------------------------------------------
