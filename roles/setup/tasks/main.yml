- name: Ensure required packages are installed
  package:
    name:
      - curl
    state: present

- name: Include SSH setup
  import_tasks: ssh.yml
  tags:
    - ssh

# - name: Include Git setup
#   import_tasks: git.yml
#   tags:
#     - git

- name: Include Zsh setup
  import_tasks: zsh.yml
  tags:
    - zsh

- name: Include Vim setup
  import_tasks: vim.yml
  tags:
    - vim

- name: Include fzf setup
  import_tasks: fzf.yml
  tags:
    - fzf

- name: Include tmux setup
  import_tasks: tmux.yml
  tags:
    - tmux

- name: Install ripgrep
  become: true
  ansible.builtin.package:
    name: ripgrep
    state: present
  tags: [ripgrep]

- name: Install zoxide
  become: true
  ansible.builtin.package:
    name: zoxide
    state: present
  tags: [zoxide]

- name: Include repository cloning
  import_tasks: repos.yml
  tags:
    - repos
