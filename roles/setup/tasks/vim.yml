# -----------------------------------------------------------------------------
# VIM SETUP
# -----------------------------------------------------------------------------

- name: Ensure Vim is installed
  become: yes
  package:
    name: vim
    state: present

# -----------------------------------------------------------------------------
# INSTALL PLUGINS
# -----------------------------------------------------------------------------

- name: Check if vim-plug is already installed
  stat:
    path: "{{ home_dir }}/.vim/autoload"
  register: autoload_dir
  become: false

- name: Install vim-plug
  become: false
  shell: |
    RUNZSH=no CHSH=no sh -c \
      "$(curl -fLo ~/.vim/autoload/plug.vim --create-dirs \
       https://raw.githubusercontent.com/junegunn/vim-plug/master/plug.vim)"
  args:
    executable: /bin/bash
  when: not autoload_dir.stat.exists

# -----------------------------------------------------------------------------
# ADD VIM-RELATED ZSH FUNCTIONS
# -----------------------------------------------------------------------------

- name: Ensure functions are sourced in .zshrc
  become: false
  blockinfile:
    path: "{{ home_dir }}/.zshrc"
    insertbefore: '^source \$ZSH/oh-my-zsh\.sh'
    marker: "# {mark} ANSIBLE CUSTOM FUNCTIONS"
    block: |
      # Load custom functions
      for file in {{ home_dir }}/.oh-my-zsh/custom/functions/*.zsh; do
        source "$file"
      done

# -----------------------------------------------------------------------------
