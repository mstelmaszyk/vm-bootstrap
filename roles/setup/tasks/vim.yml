# -----------------------------------------------------------------------------
# VIM SETUP
# -----------------------------------------------------------------------------

- name: Ensure Vim is installed
  become: true
  ansible.builtin.package:
    name: vim
    state: present
  tags: [vim]

# -----------------------------------------------------------------------------
# VIM-PLUG
# -----------------------------------------------------------------------------

- name: Create ~/.vim/autoload
  ansible.builtin.file:
    path: "{{ user_home }}/.vim/autoload"
    state: directory
    mode: "0755"
  tags: [vim]

- name: Install vim-plug
  ansible.builtin.get_url:
    url: https://raw.githubusercontent.com/junegunn/vim-plug/master/plug.vim
    dest: "{{ user_home }}/.vim/autoload/plug.vim"
    mode: "0644"
  tags: [vim]

# -----------------------------------------------------------------------------
# DEPLOY .VIMRC
# -----------------------------------------------------------------------------

- include_tasks: deploy_dotfile.yml
  vars:
    dotfile_name: "vim"
  tags: [vim]

# -----------------------------------------------------------------------------
# PLUGINS
# -----------------------------------------------------------------------------

- name: Install Vim plugins
  ansible.builtin.command:
    cmd: vim -es -u {{ user_home }}/.vim/vimrc -i NONE -c "PlugInstall" -c "qa"
  register: plug_install
  changed_when: "'Installing' in plug_install.stdout or 'Installing' in plug_install.stderr"
  tags: [vim]

# -----------------------------------------------------------------------------
