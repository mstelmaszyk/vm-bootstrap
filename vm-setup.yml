- name: Configure VM
  hosts: localhost
  connection: local
  become: yes

  vars_prompt:
    - name: ansible_become_pass
      prompt: "Enter sudo password for {{ lookup('env', 'USER') }}"
      private: yes

  vars:
    ansible_user: "{{ lookup('env', 'USER') }}"
    home_dir: "{{ lookup('env', 'HOME') }}"

  roles:
    - setup
